<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Artisan Marketplace</h1>
  <p id="status">Checking connection...</p>

  <h2>Add product (test)</h2>
  <form id="product-form">
    <input type="text" id="title" placeholder="Product title" required>
    <input type="text" id="material" placeholder="Material" required>
    <button type="submit">Add product</button>
  </form>
  <ul id="product-list"></ul>

  <h2>Accept order (test)</h2>
  <button id="accept-order-btn">Accept test order</button>
  <ul id="order-list"></ul>

  <h2>Submit subsidy form (test)</h2>
  <button id="submit-form-btn">Submit test subsidy form</button>
  <ul id="form-list"></ul>

  <h2>Add photo (test)</h2>
  <input type="file" id="photo-input" accept="image/*">
  <ul id="photo-list"></ul>

  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
